name: Test Implyzer

on:
  push:
    branches:
      - main
    paths:
      - 'Src/**'
      - 'Tests/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Src/**'
      - 'Tests/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: ubuntu-latest
    
    env:
      SolutionName: ./Implyzer.slnx
      ProjectPath: ./Src/Implyzer/Implyzer.csproj
      TestProjectPath: ./Tests/Implyzer.Tests.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ${{ env.SolutionName }} --ignore-failed-sources

      - name: Build project
        run: dotnet build ${{ env.ProjectPath }} --configuration ${{ matrix.configuration }} --no-restore

      - name: Build test project
        run: dotnet build ${{ env.TestProjectPath }} --configuration ${{ matrix.configuration }} --no-restore

      - name: Execute unit tests
        run: dotnet test ${{ env.TestProjectPath }} --configuration ${{ matrix.configuration }} --no-build